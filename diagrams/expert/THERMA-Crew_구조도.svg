</defs><rect x="0.75" y="0.75" width="858.5" height="1008.5" rx="18" fill="#fff" stroke="#E4E7EE" stroke-width="1.5"/><text x="28" y="44" font-size="19" font-weight="800" fill="#1F2430" text-anchor="start"><tspan font-weight="800" fill="#1F2430">THERMA-Crew 서비스 구조도</tspan></text><text x="28" y="0" font-size="0" font-weight="0" fill="" text-anchor="start"></text><text x="28" y="44" font-size="19" font-weight="800" fill="#1F2430">THERMA-Crew 서비스 구조도<tspan dx="8" font-size="13" font-weight="600" fill="#6B7280">가상 선행연구팀 · 과제 유형별 분기 → 공통 백본 수렴</tspan></text><text x="832" y="44" font-size="12" font-weight="800" fill="#E5484D" text-anchor="end">VirtualCycle선행Project</text><line x1="0" y1="71" x2="860" y2="71" stroke="#E4E7EE" stroke-width="1"/><line x1="540" y1="140" x2="540" y2="162" stroke="#9AA1AE" stroke-width="1.8" marker-end="url(#m-gray)"/><line x1="540" y1="262" x2="540" y2="284" stroke="#9AA1AE" stroke-width="1.8" marker-end="url(#m-gray)"/><line x1="540" y1="516" x2="540" y2="536" stroke="#9AA1AE" stroke-width="1.8" marker-end="url(#m-gray)"/><line x1="540" y1="628" x2="540" y2="648" stroke="#9AA1AE" stroke-width="1.8" marker-end="url(#m-gray)"/><line x1="540" y1="740" x2="540" y2="760" stroke="#9AA1AE" stroke-width="1.8" marker-end="url(#m-gray)"/><line x1="540" y1="868" x2="540" y2="888" stroke="#9AA1AE" stroke-width="1.8" marker-end="url(#m-gray)"/><line x1="206" y1="402" x2="298" y2="402" stroke="#9AA1AE" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#m-gray)"/><line x1="206" y1="568" x2="298" y2="568" stroke="#6366F1" stroke-width="1.8" marker-end="url(#m-ind)"/><line x1="300" y1="598" x2="208" y2="598" stroke="#6366F1" stroke-width="1.8" marker-end="url(#m-ind)"/><path d="M 780,688 L 806,688 Q 814,688 814,680 L 814,594 Q 814,586 806,586 L 786,586" stroke="#E5484D" stroke-width="1.8" fill="none" marker-end="url(#m-red)"/><rect x="425" y="92" width="230" height="46" rx="23" fill="#F6F7F9" stroke="#C6CBD6" stroke-width="1.5" stroke-dasharray="4 4"/><text x="540" y="112" font-size="12.5" font-weight="800" fill="#4B5563" text-anchor="middle">사람 게이트 ①</text><text x="540" y="128" font-size="10.5" font-weight="600" fill="#6B7280" text-anchor="middle">과제 입력 · 설계 브리프 승인</text><rect x="425" y="890" width="230" height="46" rx="23" fill="#F6F7F9" stroke="#C6CBD6" stroke-width="1.5" stroke-dasharray="4 4"/><text x="540" y="910" font-size="12.5" font-weight="800" fill="#4B5563" text-anchor="middle">사람 게이트 ②</text><text x="540" y="926" font-size="10.5" font-weight="600" fill="#6B7280" text-anchor="middle">최종 검토 · 확정</text><rect x="300" y="162" width="480" height="100" rx="16" fill="#F1F2FD" stroke="#C3C6F5" stroke-width="1.5"/><rect x="316" y="176" width="30" height="30" rx="9" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="331.0" y="196.04" font-size="14" font-weight="800" fill="#6366F1" text-anchor="middle">1</text><text x="358" y="192" font-size="13.5"><tspan font-weight="800" fill="#1F2430" font-size="13.5">PM 에이전트</tspan></text><text x="358" y="214" font-size="11" font-weight="500" fill="#6B7280" text-anchor="start"><tspan font-weight="500" fill="#6B7280">과제 접수 → </tspan><tspan font-weight="800" fill="#1F2430">과제 유형 분류(①~④)</tspan><tspan font-weight="500" fill="#6B7280"> → 해석 조건 번역 · 설계 브리프 생성. 적용 범위</tspan></text><text x="358" y="231" font-size="11" font-weight="500" fill="#6B7280" text-anchor="start">밖 과제는 한계 명시 후 사람에게 에스컬레이션.</text><rect x="300" y="284" width="480" height="232" rx="16" fill="#F1F2FD" stroke="#C3C6F5" stroke-width="1.5"/><rect x="316" y="298" width="30" height="30" rx="9" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="331.0" y="318.04" font-size="14" font-weight="800" fill="#6366F1" text-anchor="middle">2</text><text x="358" y="314" font-size="13.5"><tspan font-weight="800" fill="#1F2430">설계 에이전트 — 과제 유형별 탐색 플레이북 </tspan><tspan font-size="11" font-weight="600" fill="#6B7280">(분기)</tspan></text><rect x="316" y="338" width="219" height="82" rx="12" fill="#fff" stroke="#E4E7EE" stroke-width="1.5"/><rect x="327" y="349" width="18" height="18" rx="6" fill="#FFF1F2" stroke="none" stroke-width="0"/><text x="336" y="362" font-size="10.5" font-weight="800" fill="#E5484D" text-anchor="middle">①</text><text x="351" y="362" font-size="11.5" font-weight="800" fill="#1F2430" text-anchor="start">제품 설계 검토</text><text x="327" y="383" font-size="10" font-weight="500" fill="#6B7280" text-anchor="start">설계변수 공간 탐색 — 열교환기·압축기·</text><text x="327" y="398" font-size="10" font-weight="500" fill="#6B7280" text-anchor="start">운전조건, 민감도 분석으로 핵심 변수 선별</text><rect x="545" y="338" width="219" height="82" rx="12" fill="#fff" stroke="#E4E7EE" stroke-width="1.5"/><rect x="556" y="349" width="18" height="18" rx="6" fill="#FFF1F2" stroke="none" stroke-width="0"/><text x="565" y="362" font-size="10.5" font-weight="800" fill="#E5484D" text-anchor="middle">②</text><text x="580" y="362" font-size="11.5" font-weight="800" fill="#1F2430" text-anchor="start">응용 냉동사이클 적용성</text><text x="556" y="383" font-size="10" font-weight="500" fill="#6B7280" text-anchor="start">사이클 구성 공간 탐색 — 다단·캐스케이드·</text><text x="556" y="398" font-size="10" font-weight="500" fill="#6B7280" text-anchor="start">이젝터 등 구성 대안 성능·복잡도 비교</text><rect x="316" y="430" width="219" height="82" rx="12" fill="#fff" stroke="#E4E7EE" stroke-width="1.5"/><rect x="327" y="441" width="18" height="18" rx="6" fill="#FFF1F2" stroke="none" stroke-width="0"/><text x="336" y="454" font-size="10.5" font-weight="800" fill="#E5484D" text-anchor="middle">③</text><text x="351" y="454" font-size="11.5" font-weight="800" fill="#1F2430" text-anchor="start">대체냉매 탐색</text><text x="327" y="475" font-size="10" font-weight="500" fill="#6B7280" text-anchor="start">냉매 후보 공간 탐색 — 물성 DB 스크리닝 후</text><text x="327" y="490" font-size="10" font-weight="500" fill="#6B7280" text-anchor="start">성능·GWP·가연성 다목적 평가</text><rect x="545" y="430" width="219" height="82" rx="12" fill="#fff" stroke="#E4E7EE" stroke-width="1.5"/><rect x="556" y="441" width="18" height="18" rx="6" fill="#FFF1F2" stroke="none" stroke-width="0"/><text x="565" y="454" font-size="10.5" font-weight="800" fill="#E5484D" text-anchor="middle">④</text><text x="580" y="454" font-size="11.5" font-weight="800" fill="#1F2430" text-anchor="start">신기술 연구개발</text><text x="556" y="475" font-size="10" font-weight="500" fill="#6B7280" text-anchor="start">기술 조사 → 모델 반영 → 적용 효과 정량화</text><text x="556" y="490" font-size="10" font-weight="500" fill="#6B7280" text-anchor="start">및 연구 시나리오 도출</text><rect x="300" y="538" width="480" height="90" rx="16" fill="#F1F2FD" stroke="#C3C6F5" stroke-width="1.5"/><rect x="316" y="552" width="30" height="30" rx="9" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="331.0" y="572.04" font-size="14" font-weight="800" fill="#6366F1" text-anchor="middle">3</text><text x="358" y="568" font-size="13.5"><tspan font-weight="800" fill="#1F2430" font-size="13.5">해석 에이전트</tspan><tspan font-weight="600" fill="#6B7280" font-size="11"> (공통 백본으로 수렴)</tspan></text><text x="358" y="590" font-size="11" font-weight="500" fill="#6B7280" text-anchor="start">유형별 탐색 계획을 받아 케이스 자동 생성 → 1D 엔진 일괄 실행 → 수렴·실패 관리</text><text x="358" y="607" font-size="11" font-weight="500" fill="#6B7280" text-anchor="start">→ 후처리.</text><rect x="300" y="650" width="480" height="90" rx="16" fill="#F1F2FD" stroke="#C3C6F5" stroke-width="1.5"/><rect x="316" y="664" width="30" height="30" rx="9" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="331.0" y="684.04" font-size="14" font-weight="800" fill="#6366F1" text-anchor="middle">4</text><text x="358" y="680" font-size="13.5"><tspan font-weight="800" fill="#1F2430" font-size="13.5">검증 에이전트</tspan></text><text x="358" y="702" font-size="11" font-weight="500" fill="#6B7280" text-anchor="start"><tspan font-weight="500" fill="#6B7280">에너지 밸런스 · 물성 유효범위 · 경향성 검사. 기준 위반 시 </tspan><tspan font-weight="800" fill="#E5484D">반려(재해석 지시),</tspan></text><text x="358" y="719" font-size="11" font-weight="500" fill="#6B7280" text-anchor="start">통과 결과만 보고로 전달.</text><rect x="300" y="762" width="480" height="106" rx="16" fill="#F1F2FD" stroke="#C3C6F5" stroke-width="1.5"/><rect x="316" y="776" width="30" height="30" rx="9" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="331.0" y="796.04" font-size="14" font-weight="800" fill="#6366F1" text-anchor="middle">5</text><text x="358" y="792" font-size="13.5"><tspan font-weight="800" fill="#1F2430" font-size="13.5">보고 에이전트</tspan></text><text x="358" y="814" font-size="11" font-weight="500" fill="#6B7280" text-anchor="start">파레토 프론트 · 검토 보고서 초안 생성.</text><text x="358" y="831" font-size="11" font-weight="500" fill="#6B7280" text-anchor="start"><tspan font-weight="800" fill="#1F2430">유형별 산출물</tspan><tspan font-weight="500" fill="#6B7280"> — ① 추천 설계안 · ② 구성 비교표 · ③ 냉매 후보 순위표 · ④ 연구개발</tspan></text><text x="358" y="848" font-size="11" font-weight="500" fill="#6B7280" text-anchor="start">보고서</text><rect x="24" y="334" width="182" height="136" rx="16" fill="#F6F7F9" stroke="#E4E7EE" stroke-width="1.5"/><text x="39" y="356" font-size="12" font-weight="800" fill="#1F2430" text-anchor="start">지식 자산</text><text x="39" y="377" font-size="11" font-weight="500" fill="#6B7280" text-anchor="start">· 과거 검토 사례·설계 지식</text><text x="39" y="395" font-size="11" font-weight="500" fill="#6B7280" text-anchor="start">  (RAG)</text><text x="39" y="413" font-size="11" font-weight="500" fill="#6B7280" text-anchor="start">· 냉매 물성 · 규제(GWP) DB</text><text x="39" y="431" font-size="11" font-weight="500" fill="#6B7280" text-anchor="start">→ 유형별 플레이북의 근거</text><rect x="24" y="538" width="182" height="90" rx="16" fill="#fff" stroke="#6366F1" stroke-width="1.5"/><text x="39" y="560" font-size="12.5" font-weight="800" fill="#6366F1">1D 사이클 해석 엔진</text><rect x="160" y="549" width="34" height="15" rx="6" fill="#6366F1" stroke="none" stroke-width="0"/><text x="177" y="560" font-size="9" font-weight="800" fill="#fff" text-anchor="middle">MCP</text><text x="39" y="582" font-size="11" font-weight="500" fill="#6B7280" text-anchor="start">자체 개발 해석 프로그램</text><text x="39" y="599" font-size="11" font-weight="500" fill="#6B7280" text-anchor="start">해석 호출 ⇄ 결과 반환</text><rect x="548" y="624" width="108" height="18" rx="6" fill="#fff" stroke="none" stroke-width="0"/><text x="552" y="637" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">검증 통과 결과만</text><rect x="786" y="622" width="56" height="36" rx="8" fill="#FFF1F2" stroke="#F7B4B7" stroke-width="1"/><text x="814" y="636" font-size="10" font-weight="700" fill="#E5484D" text-anchor="middle">반려</text><text x="814" y="650" font-size="10" font-weight="700" fill="#E5484D" text-anchor="middle">재해석</text><line x1="0" y1="960" x2="860" y2="960" stroke="#E4E7EE" stroke-width="1"/><rect x="28" y="980" width="15" height="15" rx="5" fill="#F1F2FD" stroke="#C3C6F5" stroke-width="1.5"/><text x="50" y="991" font-size="11" font-weight="600" fill="#6B7280" text-anchor="start">AI 에이전트 (5)</text><rect x="178.0" y="980" width="15" height="15" rx="8" fill="#F6F7F9" stroke="#C6CBD6" stroke-width="1.5" stroke-dasharray="3 3"/><text x="200.0" y="991" font-size="11" font-weight="600" fill="#6B7280" text-anchor="start">사람 개입 게이트 (2곳)</text><rect x="358.0" y="980" width="15" height="15" rx="5" fill="#fff" stroke="#6366F1" stroke-width="1.5"/><text x="380.0" y="991" font-size="11" font-weight="600" fill="#6B7280" text-anchor="start">도구 · MCP</text><rect x="478.0" y="980" width="15" height="15" rx="5" fill="#F6F7F9" stroke="#E4E7EE" stroke-width="1.5"/><text x="500.0" y="991" font-size="11" font-weight="600" fill="#6B7280" text-anchor="start">지식 자산</text><line x1="568.0" y1="987" x2="590.0" y2="987" stroke="#E5484D" stroke-width="2.5"/><text x="597.0" y="991" font-size="11" font-weight="600" fill="#6B7280" text-anchor="start">검증·반려 루프</text></svg>