<marker id="m-ind" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#6366F1"/></marker>
</defs><rect x="0.75" y="0.75" width="858.5" height="732.5" rx="18" fill="#fff" stroke="#E4E7EE" stroke-width="1.5"/><text x="28" y="44" font-size="19" font-weight="800" fill="#1F2430" text-anchor="start"><tspan font-weight="800" fill="#1F2430">CYCLE-Master 서비스 구조도</tspan></text><text x="28" y="0" font-size="0" font-weight="0" fill="" text-anchor="start"></text><text x="28" y="44" font-size="19" font-weight="800" fill="#1F2430">CYCLE-Master 서비스 구조도<tspan dx="8" font-size="13" font-weight="600" fill="#6B7280">역방향(데이터 → 원인) · 하나의 진단 루프(4단계)</tspan></text><text x="832" y="44" font-size="12" font-weight="800" fill="#E5484D" text-anchor="end">냉부해(냉동사이클을 부탁해)</text><line x1="0" y1="71" x2="860" y2="71" stroke="#E4E7EE" stroke-width="1"/><line x1="420" y1="238" x2="420" y2="258" stroke="#9AA1AE" stroke-width="1.8" marker-end="url(#m-gray)"/><line x1="420" y1="364" x2="420" y2="394" stroke="#9AA1AE" stroke-width="1.8" marker-end="url(#m-gray)"/><line x1="484" y1="394" x2="484" y2="370" stroke="#E5484D" stroke-width="1.8" marker-end="url(#m-red)"/><line x1="420" y1="514" x2="420" y2="534" stroke="#9AA1AE" stroke-width="1.8" marker-end="url(#m-gray)"/><line x1="226" y1="190" x2="246" y2="190" stroke="#9AA1AE" stroke-width="1.8" marker-end="url(#m-gray)"/><line x1="226" y1="312" x2="246" y2="312" stroke="#9AA1AE" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#m-gray)"/><line x1="652" y1="290" x2="672" y2="290" stroke="#9AA1AE" stroke-width="1.8" marker-end="url(#m-gray)"/><line x1="672" y1="324" x2="652" y2="324" stroke="#9AA1AE" stroke-width="1.8" marker-end="url(#m-gray)"/><line x1="652" y1="432" x2="672" y2="432" stroke="#E5484D" stroke-width="1.8" marker-end="url(#m-red)"/><line x1="672" y1="478" x2="652" y2="478" stroke="#E5484D" stroke-width="1.8" marker-end="url(#m-red)"/><line x1="652" y1="578" x2="672" y2="578" stroke="#9AA1AE" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#m-gray)"/><text x="24" y="105" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="start">동일 프로세스가 적용되는 사용 시나리오 —</text><rect x="278" y="90" width="127.4" height="24" rx="12" fill="#fff" stroke="#E4E7EE" stroke-width="1"/><text x="341.7" y="106" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">개발 시험 이상 진단</text><rect x="413.4" y="90" width="108.60000000000001" height="24" rx="12" fill="#fff" stroke="#E4E7EE" stroke-width="1"/><text x="467.7" y="106" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">신뢰성 시험 판정</text><rect x="530.0" y="90" width="99.2" height="24" rx="12" fill="#fff" stroke="#E4E7EE" stroke-width="1"/><text x="579.6" y="106" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">필드 이슈 분석</text><rect x="637.2" y="90" width="118.0" height="24" rx="12" fill="#fff" stroke="#E4E7EE" stroke-width="1"/><text x="696.2" y="106" font-size="10.5" font-weight="700" fill="#4B5563" text-anchor="middle">성능 미달 원인규명</text><rect x="246" y="142" width="406" height="96" rx="16" fill="#F1F2FD" stroke="#C3C6F5" stroke-width="1.5"/><rect x="262" y="156" width="30" height="30" rx="9" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="277.0" y="176.04" font-size="14" font-weight="800" fill="#6366F1" text-anchor="middle">1</text><text x="304" y="172" font-size="13.5"><tspan font-weight="800" fill="#1F2430">즉시 판독</tspan></text><text x="304" y="194" font-size="11" font-weight="500" fill="#6B7280" text-anchor="start">데이터 업로드 즉시 이상 패턴 식별 · 1차 소견 제시 — 전문가 소집 대기</text><text x="304" y="211" font-size="11" font-weight="500" fill="#6B7280" text-anchor="start">구간이 소멸.</text><rect x="246" y="258" width="406" height="106" rx="16" fill="#F1F2FD" stroke="#C3C6F5" stroke-width="1.5"/><rect x="262" y="272" width="30" height="30" rx="9" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="277.0" y="292.04" font-size="14" font-weight="800" fill="#6366F1" text-anchor="middle">2</text><text x="304" y="288" font-size="13.5"><tspan font-weight="800" fill="#1F2430">가설 토론</tspan></text><text x="304" y="310" font-size="11" font-weight="500" fill="#6B7280" text-anchor="start">원인 가설을 우선순위·물리적 근거와 함께 제시하고, 엔지니어의 현장 정보</text><text x="304" y="327" font-size="11" font-weight="500" fill="#6B7280" text-anchor="start">·반박을 반영해 가설을 갱신.</text><rect x="246" y="396" width="406" height="118" rx="16" fill="#F1F2FD" stroke="#C3C6F5" stroke-width="1.5"/><rect x="262" y="410" width="30" height="30" rx="9" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="277.0" y="430.04" font-size="14" font-weight="800" fill="#6366F1" text-anchor="middle">3</text><text x="304" y="426" font-size="13.5"><tspan font-weight="800" fill="#1F2430">시뮬레이션 자가 검증</tspan><tspan dx="4" font-size="11" font-weight="600" fill="#E5484D">= 가상 재시험</tspan></text><text x="304" y="448" font-size="11" font-weight="500" fill="#6B7280" text-anchor="start">가설대로 1D 시뮬레이션을 스스로 실행, 실측 잔차로 가설을 채택/기각.</text><text x="304" y="465" font-size="11" font-weight="500" fill="#6B7280" text-anchor="start">가설이 갈리면 판별력이 큰 추가 확인 항목을 역제안.</text><rect x="246" y="534" width="406" height="112" rx="16" fill="#F1F2FD" stroke="#C3C6F5" stroke-width="1.5"/><rect x="262" y="548" width="30" height="30" rx="9" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="277.0" y="568.04" font-size="14" font-weight="800" fill="#6366F1" text-anchor="middle">4</text><text x="304" y="564" font-size="13.5"><tspan font-weight="800" fill="#1F2430">원인 확정 · 진단 리포트</tspan></text><text x="304" y="586" font-size="11" font-weight="500" fill="#6B7280" text-anchor="start">검증 이력·근거·권고 대책이 포함된 리포트 자동 생성. 모든 가설의 확신도</text><text x="304" y="603" font-size="11" font-weight="500" fill="#6B7280" text-anchor="start">미달 시 결론을 강요하지 않고 쟁점 정리 후 이관.</text><rect x="24" y="142" width="202" height="96" rx="16" fill="#F6F7F9" stroke="#E4E7EE" stroke-width="1.5"/><text x="39" y="164" font-size="12" font-weight="800" fill="#1F2430" text-anchor="start">사이클 시험 데이터</text><text x="39" y="185" font-size="11" font-weight="500" fill="#6B7280" text-anchor="start">P-h 선도 · 시계열 거동 업로드</text><text x="39" y="202" font-size="11" font-weight="500" fill="#6B7280" text-anchor="start">(전 부서 공통 입력)</text><rect x="24" y="258" width="202" height="134" rx="16" fill="#F6F7F9" stroke="#E4E7EE" stroke-width="1.5"/><text x="39" y="280" font-size="12" font-weight="800" fill="#1F2430" text-anchor="start">지식 자산</text><text x="39" y="301" font-size="11" font-weight="500" fill="#6B7280" text-anchor="start">· 고장 시그니처 라이브러리</text><text x="39" y="319" font-size="11" font-weight="500" fill="#6B7280" text-anchor="start">  (시뮬레이션 고장 주입 생성)</text><text x="39" y="337" font-size="11" font-weight="500" fill="#6B7280" text-anchor="start">· 전문가 경험 지식 (RAG)</text><rect x="672" y="258" width="164" height="106" rx="16" fill="#F6F7F9" stroke="#C6CBD6" stroke-width="1.5" stroke-dasharray="4 4"/><text x="687" y="280" font-size="12" font-weight="800" fill="#1F2430" text-anchor="start">엔지니어 (전 부서)</text><text x="687" y="301" font-size="11" font-weight="500" fill="#6B7280" text-anchor="start">선행·개발·신뢰성·생산</text><text x="687" y="318" font-size="11" font-weight="500" fill="#6B7280" text-anchor="start">현장 정보 제공 · 반박</text><rect x="672" y="396" width="164" height="118" rx="16" fill="#fff" stroke="#6366F1" stroke-width="1.5"/><text x="687" y="418" font-size="12" font-weight="800" fill="#6366F1">1D 사이클</text><text x="687" y="434" font-size="12" font-weight="800" fill="#6366F1">시뮬레이션</text><rect x="754" y="422" width="34" height="15" rx="6" fill="#6366F1" stroke="none" stroke-width="0"/><text x="771" y="433" font-size="9" font-weight="800" fill="#fff" text-anchor="middle">MCP</text><text x="687" y="456" font-size="11" font-weight="500" fill="#6B7280" text-anchor="start">가설대로 사이클 재현</text><text x="687" y="474" font-size="10.5" font-weight="700" fill="#E5484D" text-anchor="start">가설 → 재현 / 잔차 → 판정</text><rect x="672" y="534" width="164" height="112" rx="16" fill="#F6F7F9" stroke="#C6CBD6" stroke-width="1.5" stroke-dasharray="4 4"/><text x="687" y="556" font-size="12" font-weight="800" fill="#1F2430" text-anchor="start">전문가 에스컬레이션</text><text x="687" y="577" font-size="11" font-weight="500" fill="#6B7280" text-anchor="start">확신도 미달 시</text><text x="687" y="594" font-size="11" font-weight="500" fill="#6B7280" text-anchor="start">쟁점 정리 후 이관</text><rect x="498" y="369" width="132" height="22" rx="8" fill="#FFF1F2" stroke="#F7B4B7" stroke-width="1"/><text x="564" y="384" font-size="10" font-weight="700" fill="#E5484D" text-anchor="middle">기각 시 가설 갱신 ↺</text><text x="246" y="668" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">성능 검증 — 원인 확정 과거 이슈 블라인드 테스트 · 1순위 가설 일치율 80%+ 목표 (생성은 시뮬레이션, 검증은 전문가·실측)</text><line x1="0" y1="684" x2="860" y2="684" stroke="#E4E7EE" stroke-width="1"/><rect x="28" y="704" width="15" height="15" rx="5" fill="#F1F2FD" stroke="#C3C6F5" stroke-width="1.5"/><text x="50" y="715" font-size="11" font-weight="600" fill="#6B7280" text-anchor="start">가상전문가의 진단 단계 (1→4)</text><rect x="248.0" y="704" width="15" height="15" rx="8" fill="#F6F7F9" stroke="#C6CBD6" stroke-width="1.5" stroke-dasharray="3 3"/><text x="270.0" y="715" font-size="11" font-weight="600" fill="#6B7280" text-anchor="start">사람 (엔지니어·전문가)</text><rect x="418.0" y="704" width="15" height="15" rx="5" fill="#fff" stroke="#6366F1" stroke-width="1.5"/><text x="440.0" y="715" font-size="11" font-weight="600" fill="#6B7280" text-anchor="start">도구 · MCP</text><rect x="538.0" y="704" width="15" height="15" rx="5" fill="#F6F7F9" stroke="#E4E7EE" stroke-width="1.5"/><text x="560.0" y="715" font-size="11" font-weight="600" fill="#6B7280" text-anchor="start">입력 데이터 · 지식 자산</text><line x1="718.0" y1="711" x2="740.0" y2="711" stroke="#E5484D" stroke-width="2.5"/><text x="747.0" y="715" font-size="11" font-weight="600" fill="#6B7280" text-anchor="start">시뮬레이션 검증 루프</text></svg>